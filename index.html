      <style>

      #sun {
        mix-blend-mode: overlay;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
      #sun div {
        content: "";
        display: block;
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50vw 0;
        animation: sun 7s ease infinite alternate;

        mask-image: linear-gradient(
          to bottom,
          transparent 15%,
          white 50%,
          white 55%,
          transparent 80%
        );
      }
      #sun #sun_layer1 {
        background: linear-gradient(
          to right,
          transparent 39%,
          white 40%,
          transparent 41%,
          transparent 48.5%,
          white 50%,
          transparent 51.5%,
          transparent 53%,
          white 54%,
          transparent 55%,
          transparent 70%,
          white 71%,
          transparent 72%
        );
      }
      #sun #sun_layer2 {
        animation-delay: -2s;
        animation-duration: 7.8s;
        animation-direction: alternate-reverse;
        background: linear-gradient(
          to right,
          transparent 32%,
          white 33%,
          transparent 34%,
          transparent 38%,
          white 39%,
          transparent 40%,
          transparent 53%,
          white 54%,
          transparent 55%,
          transparent 63.5%,
          white 65%,
          transparent 66.5%
        );
      }
      #sun #sun_layer3 {
        animation-delay: -5s;
        animation-duration: 8.5s;
        background: linear-gradient(
          to right,
          transparent 38.5%,
          white 40%,
          transparent 41.5%,
          transparent 47%,
          white 48%,
          transparent 49%,
          transparent 52%,
          white 53%,
          transparent 54%,
          transparent 60%,
          white 61%,
          transparent 62%
        );
      }

      @keyframes surface {
        0% {
          opacity: 0;
          background-position: center bottom;
          background-size: calc(3 * var(--highHeight)) var(--highHeight);
        }
        20% {
          opacity: var(--opacity);
        }
        100% {
          opacity: 0;
          background-position: center bottom calc(-1 * var(--lowHeight));
          background-size: calc(1 * var(--lowHeight)) var(--lowHeight);
        }
      }
      @keyframes caustics {
        0% {
          background-position: bottom var(--gapY) left;
        }
        100% {
          background-position: bottom var(--gapY) left -100vw;
        }
      }
      @keyframes sun {
        0% {
          opacity: 0.1;
          transform: skew(5deg) scale3d(3, 1.5, 1);
        }
        50% {
          opacity: 0.08;
          transform: skew(0deg) scale3d(1.5, 1, 1);
        }
        100% {
          opacity: 0.1;
          transform: skew(-5deg) scale3d(3, 1, 1);
        }
      }
      @media (orientation: portrait) {
        :root {
          --ratioW: 1;
        }
      }
      @media (min-aspect-ratio: 1/1) {
        :root {
          --ratioW: 2;
        }
      }
      @media (min-aspect-ratio: 2/1) {
        :root {
          --ratioW: 3;
        }
      }
      @media (min-aspect-ratio: 3/1) {
        :root {
          --ratioW: 4;
        }
      }
      @media (min-aspect-ratio: 4/1) {
        :root {
          --ratioW: 5;
        }
      }
      @media (min-aspect-ratio: 5/1) {
        :root {
          --ratioW: 6;
        }
      }
    </style>
